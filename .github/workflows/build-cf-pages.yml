name: Build for Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "custom-apps/**"
      - "data/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-cf-pages.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SELF_HOSTED_MODE: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install next-on-pages
        run: npm install --no-save --legacy-peer-deps @cloudflare/next-on-pages@1.13.16 esbuild@0.25.0

      - name: Build (next-on-pages)
        run: npx @cloudflare/next-on-pages@1.13.16

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-pages-static
          path: .vercel/output/static
          if-no-files-found: error
          retention-days: 3
